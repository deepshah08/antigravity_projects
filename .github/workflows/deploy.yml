name: Deploy Offline Knowledge Center to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Cloud Scraping Pipeline
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          chmod +x run_pipeline.sh
          ./run_pipeline.sh

      - name: Commit Scraped Data Back to Main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(cloud-scraper): Automated cloud scraping update"

      - name: Install Frontend Dependencies
        run: |
          cd offline-knowledge-center
          npm ci

      - name: Build Vite PWA App
        run: |
          cd offline-knowledge-center
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'offline-knowledge-center/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
