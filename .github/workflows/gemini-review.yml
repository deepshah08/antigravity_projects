name: Gemini Automated Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    name: Run Gemini Code Review
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gemini Code Review
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are an expert code reviewer. Please review this Pull Request for security, performance, code cleanliness, and adherence to project conventions. Highlight any potential bugs or regressions.
